<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Command Session</title>
<style>
:root {
	--bg: #eef0f2; --panel: #ffffff; --ink: #1a1f24; --muted: #5f6a74; --line: #d6dce1;
	--term-bg: #15181b; --term-ink: #e4e6e2; --term-dim: #8c918d;
	--accent: #1f6f8b; --ok: #2e8b57; --warn: #b7791f; --err: #c0392b;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #111416; --panel: #191d20; --ink: #e8ebed; --muted: #97a1a9; --line: #2a3035;
		--term-bg: #0a0c0d; --accent: #5fb3d1; --ok: #5cc48a; --warn: #e0a84a; --err: #ef6b5b;
	}
}
:root[data-theme="dark"] {
	--bg: #111416; --panel: #191d20; --ink: #e8ebed; --muted: #97a1a9; --line: #2a3035;
	--term-bg: #0a0c0d; --accent: #5fb3d1; --ok: #5cc48a; --warn: #e0a84a; --err: #ef6b5b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
h1 { font-size: 22px; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; }
.fake { display: inline-block; font-size: 12px; padding: 2px 8px; border: 1px solid var(--warn); color: var(--warn); border-radius: 999px; margin-left: 8px; vertical-align: middle; }
.rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.st { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.st b { display: block; font-size: 14px; }
.st[data-s="active"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.st[data-s="approved"] b::after { content: " \2713"; color: var(--ok); }
.grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .rail { grid-template-columns: repeat(2, 1fr); } }
.term { background: var(--term-bg); color: var(--term-ink); border-radius: 10px; padding: 14px 16px; min-height: 360px; overflow-x: auto;
	font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
.term .p { color: var(--accent); } .term .d { color: var(--term-dim); } .term .w { color: var(--warn); } .term .o { color: var(--ok); }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.note h2 { font-size: 15px; margin: 0 0 6px; }
.note p { margin: 0; color: var(--muted); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }
</style>
</head>
<body>
<main>
	<div>
		<h1>pnpm task draft <span class="fake">illustrative: fake change, fake output</span></h1>
		<p class="sub">One command starts the draft. After that you only answer reviews, and each answer prints the next one.</p>
	</div>
	<div class="rail" id="rail">
		<div class="st" data-stage="proposal"><b>Proposal</b>proposal.md · slices.md</div>
		<div class="st" data-stage="design"><b>Design</b>design.md · mock · examples</div>
		<div class="st" data-stage="specs"><b>Specs</b>specs/**/spec.md</div>
		<div class="st" data-stage="tasks"><b>Tasks</b>tasks.md</div>
	</div>
	<div class="grid">
		<div class="term" id="term" aria-live="polite"></div>
		<div class="note"><h2 id="nt"></h2><p id="nb"></p></div>
	</div>
	<div class="controls">
		<button id="prev" type="button">Back</button>
		<button id="next" class="primary" type="button">Next step</button>
		<span class="count" id="count"></span>
	</div>
</main>
<script>
const P = (s) => '<span class="p">$</span> ' + s;
const review = (id) => ['  approve:  pnpm task answer ' + id + ' --by principal --decision approve', '  revise:   pnpm task answer ' + id + ' --by principal --decision "&lt;what to change&gt;"'];
const steps = [
	{ stage: "proposal", approved: [], title: "Start a draft",
		body: "Give the intent once. The draft runs the proposal stage until its rules pass, then stops for your review.",
		term: [P('pnpm task draft add-plan-export --intent "Export a plan as JSON so CI can read it"'), '# draft 12 — blocked (review)', '### proposal draft 1: 1 issue', '<span class="w">   WARNING proposal.md: touches 3 capabilities, over the budget of 2.</span>', '### proposal draft 2: <span class="o">clean</span>', '', 'Review openspec/changes/add-plan-export/proposal.md, slices.md, then:', ...review(12)] },
	{ stage: "proposal", approved: [], title: "Revise",
		body: "Anything but approve goes back to the agent as a revision request. The same stage drafts again.",
		term: [P('pnpm task answer 12 --by principal --decision "JSON only; no CSV"'), '# draft 13 — blocked (review)', '### proposal draft 3: <span class="o">clean</span>', '', 'Review openspec/changes/add-plan-export/proposal.md, slices.md, then:', ...review(13)] },
	{ stage: "design", approved: ["proposal"], title: "Approve, and the next stage drafts",
		body: "One answer approves the proposal and drafts the design. Because the proposal was sliced, the other slices' draft commands are listed once, here.",
		term: [P('pnpm task answer 13 --by principal --decision approve'), '# draft 14 — blocked (review)', '## proposal: <span class="o">approved</span>', '### design draft 1: <span class="o">clean</span>', '', 'Sliced into 3 changes. Draft the others when you\'re ready:', '  pnpm task draft add-plan-export-schema --intent "Publish the JSON Schema…"', '  pnpm task draft add-plan-export-ci --intent "Fail a PR whose plan export…"', '', 'Review design.md, design/mock.html, design/examples/export.sh, then:', ...review(14)] },
	{ stage: "design", approved: ["proposal"], title: "A second draft is refused",
		body: "While a review is open, starting the same draft again is refused. It names the loop waiting for you.",
		term: [P('pnpm task draft add-plan-export'), 'add-plan-export is waiting for an answer to loop 14 (review of the design).', ...review(14), '<span class="d">exit 2</span>'] },
	{ stage: "specs", approved: ["proposal", "design"], title: "Specs",
		body: "The specs stage checks its deltas with openspec validate --strict and the size budget before you see them.",
		term: [P('pnpm task answer 14 --by principal --decision approve'), '# draft 15 — blocked (review)', '## proposal: <span class="o">approved</span>', '## design: <span class="o">approved</span>', '### specs draft 1: 1 issue', '<span class="w">   ERROR specs/plan/export/spec.md: Requirement must have at least one scenario</span>', '### specs draft 2: <span class="o">clean</span>', '', 'Review specs/plan/export/spec.md, then:', ...review(15)] },
	{ stage: "tasks", approved: ["proposal", "design", "specs"], title: "Tasks",
		body: "Every task is one file and one line, and every scenario is named by a task.",
		term: [P('pnpm task answer 15 --by principal --decision approve'), '# draft 16 — blocked (review)', '## proposal: <span class="o">approved</span>', '## design: <span class="o">approved</span>', '## specs: <span class="o">approved</span>', '### tasks draft 1: <span class="o">clean</span>', '', 'Review tasks.md, then:', ...review(16)] },
	{ stage: "tasks", approved: ["proposal", "design", "specs", "tasks"], title: "Drafted",
		body: "Every stage is approved. The last line is the command to execute the change. After add-build-cli it reads pnpm task build add-plan-export.",
		term: [P('pnpm task answer 16 --by principal --decision approve'), '# draft 17 — <span class="o">converged</span>', '## proposal: <span class="o">approved</span>', '## design: <span class="o">approved</span>', '## specs: <span class="o">approved</span>', '## tasks: <span class="o">approved</span>', '', 'Every stage of add-plan-export is approved. Execute it: pnpm task add-plan-export --next-group'] },
];
let at = 0;
const $ = (id) => document.getElementById(id);
function render() {
	const s = steps[at];
	for (const el of document.querySelectorAll(".st")) {
		const n = el.dataset.stage;
		el.dataset.s = s.approved.includes(n) ? "approved" : n === s.stage ? "active" : "";
	}
	$("term").innerHTML = s.term.join("\n");
	$("nt").textContent = s.title;
	$("nb").textContent = s.body;
	$("prev").disabled = at === 0;
	$("next").disabled = at === steps.length - 1;
	$("count").textContent = "Step " + (at + 1) + " of " + steps.length;
}
$("prev").addEventListener("click", () => { if (at > 0) { at--; render(); } });
$("next").addEventListener("click", () => { if (at < steps.length - 1) { at++; render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("prev").click(); });
render();
</script>
</body>
</html>
